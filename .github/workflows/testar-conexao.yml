name: Testar conexão com a Hostinger

# Só roda à mão e não tem nenhuma opção de envio: o rsync abaixo está sempre em --dry-run, sem --delete.
# Não usa o build definitivo nem PRODUCAO_LIBERADA, e não troca nenhuma trava do workflow Publicar.
# Procedimento: docs/PUBLICACAO.md
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
  SSH_PORTA: ${{ secrets.HOSTINGER_SSH_PORTA }}
  SSH_USUARIO: ${{ secrets.HOSTINGER_SSH_USUARIO }}
  PASTA: ${{ secrets.HOSTINGER_CAMINHO_PRODUCAO }}

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Conferir configuração
        env:
          SSH_CHAVE: ${{ secrets.HOSTINGER_SSH_CHAVE }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          for v in SSH_HOST SSH_PORTA SSH_USUARIO SSH_CHAVE SSH_KNOWN_HOSTS PASTA; do
            [ -n "${!v}" ] || { echo "::error::Falta configurar $v. Ver docs/PUBLICACAO.md"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_CHAVE" > ~/.ssh/hostinger
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger ~/.ssh/known_hosts
          echo "Fingerprint guardada no GitHub. Precisa ser igual à do hPanel:"
          ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $1, $2, $NF}'
          echo "OPCOES=-p $SSH_PORTA -i $HOME/.ssh/hostinger -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      # Prova de que a validação está ligada: sem a host key conhecida, a conexão precisa ser recusada
      - name: Conferir que servidor desconhecido é recusado
        run: |
          if saida=$(ssh $OPCOES -o UserKnownHostsFile=/dev/null "$SSH_USUARIO@$SSH_HOST" true 2>&1); then
            echo "::error::A conexão foi aceita sem host key conhecida."
            exit 1
          fi
          case "$saida" in
            *"Host key verification failed"*|*"host key"*) echo "ok: recusado sem a host key" ;;
            *) echo "::error::Falhou por outro motivo: $saida"; exit 1 ;;
          esac

      - name: Testar conexão, só leitura
        run: |
          ssh $OPCOES "$SSH_USUARIO@$SSH_HOST" 'echo "conexão ok"; command -v rsync >/dev/null && echo "rsync ok no servidor"'
          ssh $OPCOES "$SSH_USUARIO@$SSH_HOST" "test -d '$PASTA'" || { echo "::error::A pasta de produção não existe ou a conexão falhou."; exit 1; }
          echo "ok: pasta de produção existe"
          # O WordPress segue no ar, então o arquivo precisa estar lá. Se não estiver, o caminho está errado
          ssh $OPCOES "$SSH_USUARIO@$SSH_HOST" "test -e '$PASTA/wp-config.php'" || { echo "::error::wp-config.php não encontrado: confira o caminho."; exit 1; }
          echo "ok: WordPress encontrado no caminho configurado"
          ssh $OPCOES "$SSH_USUARIO@$SSH_HOST" "test -w '$PASTA'" && echo "ok: a pasta aceitaria gravação" || echo "::warning::O usuário não tem permissão de gravação na pasta."
          ssh $OPCOES "$SSH_USUARIO@$SSH_HOST" "find '$PASTA' -maxdepth 1 -printf '%f %s %T@\n' | sort | sha256sum" > "$RUNNER_TEMP/antes.txt"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vídeos iguais aos aprovados
        run: npm run verificar:videos

      # Build de revisão: serve só para comparar a lista de arquivos. Nada é enviado
      - name: Gerar lista de arquivos
        run: npm run build

      - name: Simular envio, sem gravar nada
        run: |
          rsync -az --dry-run --itemize-changes -e "ssh $OPCOES" dist/ "$SSH_USUARIO@$SSH_HOST:$PASTA/" > rsync.log
          echo "Itens que seriam novos ou alterados: $(wc -l < rsync.log)"
          echo "Arquivos que já existem no servidor e seriam alterados:"
          grep -E '^<f[^+]' rsync.log || echo "nenhum"
          echo "Primeiras linhas:"
          head -40 rsync.log

      - name: Conferir que a raiz do site não mudou
        run: |
          ssh $OPCOES "$SSH_USUARIO@$SSH_HOST" "find '$PASTA' -maxdepth 1 -printf '%f %s %T@\n' | sort | sha256sum" > "$RUNNER_TEMP/depois.txt"
          if cmp -s "$RUNNER_TEMP/antes.txt" "$RUNNER_TEMP/depois.txt"; then
            echo "ok: raiz do site idêntica antes e depois"
          else
            echo "::warning::A raiz do site mudou durante o teste. O rsync estava em --dry-run; confira se foi o próprio WordPress."
          fi

      - name: Apagar chave
        if: always()
        run: rm -f ~/.ssh/hostinger
