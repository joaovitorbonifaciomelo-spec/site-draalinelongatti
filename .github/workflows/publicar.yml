name: Publicar na Hostinger

# Só roda quando alguém aciona à mão. Não existe publicação automática por push.
# O plano gratuito do GitHub não tem revisores em repositório privado: as travas estão nos passos abaixo.
# Procedimento completo: docs/PUBLICACAO.md
on:
  workflow_dispatch:
    inputs:
      destino:
        description: "Para onde enviar"
        type: choice
        required: true
        default: homologacao
        options: [homologacao, producao]
      acao:
        description: "simular mostra o que seria enviado, sem gravar nada"
        type: choice
        required: true
        default: simular
        options: [simular, enviar]
      confirmacao:
        description: "Só para enviar à produção: SUBSTITUIR WORDPRESS"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  DESTINO: ${{ inputs.destino }}
  ACAO: ${{ inputs.acao }}
  CONFIRMACAO: ${{ inputs.confirmacao }}
  SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
  SSH_PORTA: ${{ secrets.HOSTINGER_SSH_PORTA }}
  SSH_USUARIO: ${{ secrets.HOSTINGER_SSH_USUARIO }}
  CAMINHO_HOMOLOGACAO: ${{ secrets.HOSTINGER_CAMINHO_HOMOLOGACAO }}
  CAMINHO_PRODUCAO: ${{ secrets.HOSTINGER_CAMINHO_PRODUCAO }}
  URL_HOMOLOGACAO: ${{ vars.URL_HOMOLOGACAO }}
  PRODUCAO_LIBERADA: ${{ vars.PRODUCAO_LIBERADA }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir autorização e configuração
        run: |
          for v in SSH_HOST SSH_PORTA SSH_USUARIO; do
            [ -n "${!v}" ] || { echo "::error::Falta configurar $v. Ver docs/PUBLICACAO.md"; exit 1; }
          done
          if [ "$DESTINO" = "producao" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Produção só publica a partir de main."; exit 1; }
            [ "$PRODUCAO_LIBERADA" = "sim" ] || { echo "::error::Produção não liberada: a variável PRODUCAO_LIBERADA não é 'sim'."; exit 1; }
            [ -n "$CAMINHO_PRODUCAO" ] || { echo "::error::Falta o caminho de produção."; exit 1; }
            if [ "$ACAO" = "enviar" ] && [ "$CONFIRMACAO" != "SUBSTITUIR WORDPRESS" ]; then
              echo "::error::Confirmação incorreta."; exit 1
            fi
            echo "PASTA=$CAMINHO_PRODUCAO" >> "$GITHUB_ENV"
          else
            [ -n "$CAMINHO_HOMOLOGACAO" ] && [ -n "$URL_HOMOLOGACAO" ] || { echo "::error::Falta configurar a homologação."; exit 1; }
            case "$CAMINHO_HOMOLOGACAO" in
              */public_html|*/public_html/) echo "::error::A homologação não pode apontar para a raiz do site."; exit 1 ;;
            esac
            [ "$CAMINHO_HOMOLOGACAO" != "$CAMINHO_PRODUCAO" ] || { echo "::error::Homologação e produção apontam para o mesmo lugar."; exit 1; }
            # O filme e os dados provisórios não podem ficar abertos: a pasta precisa pedir senha antes de receber o site
            codigo=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$URL_HOMOLOGACAO" || true)
            [ "$codigo" = "401" ] || { echo "::error::A homologação respondeu $codigo. Proteja a pasta com senha no hPanel antes de enviar."; exit 1; }
            echo "PASTA=$CAMINHO_HOMOLOGACAO" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vídeos iguais aos aprovados
        run: npm run verificar:videos

      - name: Código
        run: npm run check

      - name: Build de homologação (noindex, com marcas de revisão)
        if: inputs.destino == 'homologacao'
        run: npm run build

      # Falha enquanto houver conteúdo provisório. Essa falha é a trava de publicação: não contornar.
      - name: Build definitivo
        if: inputs.destino == 'producao'
        env:
          PUBLIC_REVISAO: "0"
        run: |
          npm run build
          node scripts/gerar-htaccess.mjs --final

      - name: Preparar acesso SSH
        env:
          SSH_CHAVE: ${{ secrets.HOSTINGER_SSH_CHAVE }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_CHAVE" ] && [ -n "$SSH_KNOWN_HOSTS" ] || { echo "::error::Faltam a chave SSH ou o known_hosts."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_CHAVE" > ~/.ssh/hostinger
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -p $SSH_PORTA -i $HOME/.ssh/hostinger -o StrictHostKeyChecking=yes -o BatchMode=yes" >> "$GITHUB_ENV"

      # Se wp-config.php ainda estiver na pasta, o WordPress não foi retirado: nada é enviado por cima dele
      - name: Conferir destino no servidor
        run: |
          $SSH_CMD "$SSH_USUARIO@$SSH_HOST" "test -d '$PASTA'" || { echo "::error::A pasta de destino não existe."; exit 1; }
          if $SSH_CMD "$SSH_USUARIO@$SSH_HOST" "test -e '$PASTA/wp-config.php'"; then
            if [ "$ACAO" = "enviar" ]; then
              echo "::error::O WordPress ainda está no destino. Siga o procedimento de substituição em docs/PUBLICACAO.md."
              exit 1
            fi
            echo "::warning::O WordPress ainda está no destino. Um envio real seria recusado."
          fi

      # Produção sem --delete: nada é apagado no servidor. A homologação é uma pasta só do site e mantém a proteção de senha
      - name: Enviar
        run: |
          opcoes=(-az --itemize-changes)
          [ "$ACAO" = "simular" ] && opcoes+=(--dry-run)
          [ "$DESTINO" = "homologacao" ] && opcoes+=(--delete --exclude=.htaccess --exclude=.htpasswd)
          rsync "${opcoes[@]}" -e "$SSH_CMD" dist/ "$SSH_USUARIO@$SSH_HOST:$PASTA/" | tee rsync.log | tail -40
          echo "Itens: $(wc -l < rsync.log). Ação: $ACAO. Destino: $DESTINO."

      - name: Conferir produção
        if: inputs.destino == 'producao' && inputs.acao == 'enviar'
        run: |
          for caminho in / /sobre/ /tratamentos/ /contato/ /robots.txt /sitemap.xml /media/hero-desktop.mp4 /media/hero-mobile.mp4; do
            codigo=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://draalinelongatti.com$caminho")
            echo "$codigo $caminho"
            [ "$codigo" = "200" ] || exit 1
          done

      - name: Apagar chave
        if: always()
        run: rm -f ~/.ssh/hostinger
